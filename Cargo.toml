[package]
name = "updt"
version = "0.1.8"
edition = "2024"
description = "Cross-platform update helper for npm, cargo, rustup, Homebrew, paru, flatpak, pacman, and pkg."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/jihaohaaaa/updt"
repository = "https://github.com/jihaohaaaa/updt"
documentation = "https://docs.rs/updt"
keywords = ["update", "system", "package-manager", "cli", "automation"]
categories = ["command-line-utilities"]

[dependencies]
clap = "4.6.1"
ratatui = "0.30.0"
chrono = { version = "0.4.42", default-features = true }
serde_json = "1.0.145"
crossterm = "0.29.0"
