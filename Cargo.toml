[package]
name = "updt"
version = "0.1.3"
edition = "2024"
description = "Cross-platform system update helper for brew, npm, cargo, rustup, paru, flatpak, and pacman."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/jihaohaaaa/updt"
repository = "https://github.com/jihaohaaaa/updt"
documentation = "https://docs.rs/updt"
keywords = ["update", "system", "package-manager", "cli", "automation"]
categories = ["command-line-utilities"]

[dependencies]
clap = "4.6.1"
ratatui = "0.30.0"
chrono = { version = "0.4.42", default-features = true }
serde_json = "1.0.145"
crossterm = "0.29.0"
